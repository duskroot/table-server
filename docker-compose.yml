services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: table
      MYSQL_DATABASE: table_party
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptable", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  tabled:
    build: .
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      CONFIG_URL: "https://config.nginx.systems"
      CONFIG_NAMESPACE: "dev"
      CONFIG_ENV: "prod"
      CONFIG_APP_ID: "table-server"
      CONFIG_FILE: "application"
      DEV: "1"
    ports:
      - "8080:8080"
